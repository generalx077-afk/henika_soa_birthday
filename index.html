<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#FFF4FB">
  <title>A Birthday Surprise for Henintsoa 💌</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="sparkles" aria-hidden="true">
    <span>✦</span><span>★</span><span>♥</span><span>✧</span><span>✦</span>
    <span>♥</span><span>★</span><span>✧</span><span>✦</span><span>♥</span>
    <span>★</span><span>✧</span><span>✦</span><span>♥</span><span>★</span>
  </div>

  <main class="page">
    <header class="heading">
      <div class="eyebrow">A LITTLE BIRTHDAY SURPRISE</div>
      <h1>Hey, <span>Henintsoa!</span></h1>
      <p>Someone made a little something just for you...</p>
    </header>

    <section class="scene" aria-label="Une enveloppe contenant un message d'anniversaire">
      <article class="letter" id="letter" aria-hidden="true">
        <p id="typedMessage"></p>
      </article>
      <div class="envelope" id="envelope">
        <div class="envelope-back"></div>
        <div class="envelope-front"></div>
        <div class="envelope-flap" id="flap"></div>
        <div class="envelope-heart" id="heart">♥</div>
      </div>
    </section>

    <button id="openButton" class="open-button">OPEN YOUR LETTER&nbsp; 💌</button>
    <p class="status" id="status" aria-live="polite">Psst... a little surprise is waiting inside!</p>
    <footer>Made with confetti &amp; friendship ♥</footer>
  </main>
  <script src="script.js"></script>
</body>
</html>
